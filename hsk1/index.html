<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Game New HSK 1 · himawari.cn</title>
<style>
:root{--cherry:#990011;--navy:#2f3c7e;--ink:#2b2b2b;--muted:#6b6b6b;--tint:#fbe9ea;--line:#f1c7cb;--ok:#1f7a4d;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fdeceb;--bg:#fffafa}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:720px;margin:0 auto;padding:12px 14px 40px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top img{height:34px;width:auto}
.xp{font-weight:700;color:var(--navy);background:#eceffa;border-radius:999px;padding:4px 12px;font-size:.9rem}
h1{font-size:1.45rem;line-height:1.25;margin:4px 0 2px;color:var(--cherry)}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:72px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:10px 12px}
.lv:hover:not(:disabled){background:var(--tint)}
.lv:disabled{opacity:.55;cursor:not-allowed;background:#f5f2f2}
.lv .ic{flex:none;width:52px;height:52px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:1.6rem}
.lv.done .ic{background:var(--cherry)}
.lv b{display:block}.lv small{color:var(--muted)}
.stars{margin-left:auto;font-size:1.2rem;color:#e0a100;white-space:nowrap;letter-spacing:2px}
.btn{min-height:48px;padding:10px 18px;font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--cherry);background:#fff;color:var(--cherry);cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){background:var(--tint)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--cherry);color:#fff}.btn.primary:hover:not(:disabled){background:#76000d}
.btn.navy{border-color:var(--navy);color:var(--navy)}
.btn.wide{width:100%}
button:focus-visible{outline:3px solid #f3a0ab;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts-note{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.opts-note label{display:flex;gap:6px;align-items:center;font-size:.92rem;color:var(--muted);cursor:pointer}
.opts-note input{width:20px;height:20px}
.bar{height:10px;border-radius:99px;background:#f0e1e3;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--cherry);width:0;transition:width .3s}
.qhead{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted)}
.chip{background:var(--tint);color:var(--cherry);border-radius:999px;padding:2px 10px;font-weight:700}
.prompt{text-align:center;padding:8px 4px}
.prompt .lab{color:var(--muted);font-size:.9rem;margin-bottom:4px}
.prompt .big{font-size:clamp(2.4rem,12vw,4rem);line-height:1.2;font-weight:500;overflow-wrap:anywhere}
.prompt .big.t{font-size:clamp(1.5rem,6vw,2.1rem)}
.prompt .py{color:var(--muted);font-size:1.05rem}
.prompt .idn{color:var(--muted);font-size:.95rem;font-style:italic}
.opt{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:54px;text-align:left;font:inherit;color:inherit;cursor:pointer;margin-bottom:8px;padding:10px 14px;background:#fff;border:1.5px solid #d9cfd0;border-radius:12px;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--navy);background:#f3f5fc}
.opt .m{font-size:1.2rem}.opt .s{color:var(--muted);font-size:.88rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.fb.ok{background:var(--okbg);color:#14502f}.fb.bad{background:var(--badbg);color:#7a1a14}
.fb b{display:block}.fb .ex{margin-top:4px;color:var(--ink)}
.story{background:#fffdfd;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.story .tt{font-weight:700;color:var(--navy);margin-bottom:4px}
.story .hz{font-size:1.25rem;line-height:1.35}.story .py{color:var(--muted);font-size:.85rem;margin-bottom:5px}
.tr{margin-top:6px;font-size:.92rem;color:var(--muted);font-style:italic}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed #d9cfd0;border-radius:12px;margin-bottom:10px}
.tile{min-height:50px;min-width:56px;padding:4px 12px;font:inherit;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
.tile .m{font-size:1.25rem}.tile .s{font-size:.72rem;color:var(--muted)}
.tile:disabled{opacity:.4}
.player{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.play{width:84px;height:84px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:2rem;cursor:pointer}
.play:disabled{opacity:.4;cursor:not-allowed}.play.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(47,60,126,.18)}}
.warn{background:#fff6e0;border:1px solid #f0d28a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.93rem}
.result{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--cherry);line-height:1.1}
.big-stars{font-size:2.2rem;color:#e0a100;letter-spacing:6px}
.rev{text-align:left;border-top:1px solid var(--line);padding:8px 0;font-size:.95rem}
.rev .a{color:var(--bad)}.rev .c{color:var(--ok)}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function mcFromVocab(v,pool,mode,isStrict){
  const wrong=[]; const same=pool.filter(x=>x.h!==v.h&&x.i!==v.i);
  if(mode==='h2i'){ // distraktor: arti beda
    for(const x of sample(same,40)){ if(wrong.length<3&&!wrong.some(w=>w.i===x.i)&&x.i!==v.i) wrong.push(x) }
    const opts=shuffle([v,...wrong]);
    return {kind:'mc',lab:'Apa arti kata ini?',big:v.h,py:v.p,opts:opts.map(o=>({m:o.i})),ans:opts.indexOf(v),ex:v};
  }
  // distraktor mirip bunyi bila ada
  const key=stripTone(v.p), k1=stripTone(v.p.split(' ')[0]);
  const scored=shuffle(same).map(x=>({x,s:(stripTone(x.p)===key?3:stripTone(x.p.split(' ')[0])===k1?2:x.h.length===v.h.length?1:0)})).sort((a,b)=>b.s-a.s);
  for(const {x} of scored){ if(wrong.length<3&&!wrong.some(w=>w.h===x.h)&&(mode!=='h2p'||(x.p!==v.p&&!wrong.some(w=>w.p===x.p)))) wrong.push(x) }
  const opts=shuffle([v,...wrong]);
  if(mode==='h2p') return {kind:'mc',lab:'Pilih pinyin yang benar untuk kata ini:',big:v.h,opts:opts.map(o=>({m:o.p})),ans:opts.indexOf(v),ex:v};
  return {kind:'mc',lab:'Pilih hanzi untuk arti ini:',big:v.i,bigT:true,idn:v.e,opts:opts.map(o=>({m:o.h,s:o.p})),ans:opts.indexOf(v),ex:v};
}

    const out=[]; for(const st of D.stories) for(const q of st.qs){
      if(q.kind==='tf') out.push({kind:'mc',story:st,lab:'Benar atau salah?',big:q.q.h,bigT:true,py:q.q.p,idn:q.q.i,opts:[{m:'对',s:'duì (benar)'},{m:'错',s:'cuò (salah)'}],ans:q.ans,fixed:true});
      else {const idx=shuffle(q.opts.map((o,i)=>({o,i})));out.push({kind:'mc',story:st,lab:'Pilih jawaban yang paling tepat:',big:q.q.h,bigT:true,py:q.q.p,idn:q.q.i,opts:idx.map(z=>({m:z.o.h,s:z.o.p})),ans:idx.findIndex(z=>z.i===0)})}
    }
    return out; // urut per cerita
  }
  if(level===5){
    const pick=(arr,n)=>shuffle(arr).slice(0,n), g={word:[],sent:[],dlg:[]}; for(const it of D.listen) g[it.t].push(it);
    const mk=(it,sec)=>{const idx=shuffle(it.opts.map((o,i)=>({o,i})));
      return {kind:'listen',sec,it,opts:idx.map(z=>({m:z.o.h,s:z.o.p})),ans:idx.findIndex(z=>z.i===it.ans)}};
    const out=[...pick(g.word,4).map(i=>mk(i,'Bagian 1 · Kata')),...pick(g.sent,4).map(i=>mk(i,'Bagian 2 · Kalimat')),...pick(g.dlg,4).map(i=>mk(i,'Bagian 3 · Dialog')),
      ...pick(D.qa,6).map(i=>mk(i,'Bagian 4 · Tanya jawab'))];
    for(const st0 of pick(D.lstories,2)){ const st={...st0,left:2}; st.qs.forEach((sq,j)=>{ const idx=shuffle(sq.opts.map((o,i)=>({o,i})));
      out.push({kind:'listen',sec:'Bagian 5 · Cerita audio: '+st.title,first:j===0,it:{t:'storyq',st,q:sq.q,tr_h:st.tr_h,tr_py:st.tr_py},
        opts:idx.map(z=>({m:z.o,s:''})),ans:idx.findIndex(z=>z.i===sq.ans)}) }) }
    return out;
  }}

// ---------- suara ----------
let zhVoice=null, voiceB=null;
function pickVoice(){ if(!('speechSynthesis' in window)) return null;
  const vs=speechSynthesis.getVoices().filter(v=>/^(zh|cmn)/i.test(v.lang)); 
  zhVoice=vs.find(v=>/zh[-_]CN|cmn-Hans/i.test(v.lang))||vs[0]||null;
  voiceB=vs.find(v=>v!==zhVoice&&/zh[-_]CN|cmn-Hans/i.test(v.lang))||null; return zhVoice }
if('speechSynthesis' in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice }
const canSpeak=()=>('speechSynthesis' in window)&&typeof SpeechSynthesisUtterance!=='undefined';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function say(text,opts={}){ return new Promise(res=>{ const u=new SpeechSynthesisUtterance(text); u.lang='zh-CN'; u.rate=opts.rate||.8; u.pitch=opts.pitch||1; const v=opts.alt&&voiceB?voiceB:zhVoice; if(v)u.voice=v;
  let started=false,done=false,t1,t2; const fin=()=>{ if(done)return; done=true; clearTimeout(t1); clearTimeout(t2); res(started) };
  u.onstart=()=>{started=true}; u.onend=()=>{started=true;fin()}; u.onerror=()=>fin();
  t1=setTimeout(()=>{ if(!started)fin() },3500); t2=setTimeout(fin,25000);
  try{speechSynthesis.resume()}catch(e){} speechSynthesis.speak(u) }) }
async function playStory(st){ speechSynthesis.cancel(); await sleep(120); let any=false; for(let i=0;i<st.say.length;i++){ const ok=await say(st.say[i],{rate:.8}); any=any||ok; if(!ok&&i===0)break; await sleep(450) } return any }
async function playItem(it){ speechSynthesis.cancel(); await sleep(120);
  if(it.t==='storyq') return playStory(it.st);
  if(it.say.length===1) return say(it.say[0],{rate:it.t==='word'?.7:.8});
  const a=await say(it.say[0],{rate:.8}); if(!a) return false; await sleep(500); await say(it.say[1],{rate:.8,pitch:1.3,alt:true}); return true }
function noAudio(box){ if(box.querySelector('.noaud'))return; box.append(h('div',{class:'warn noaud'},'Suara belum keluar di perangkat ini. Cek volume HP dan pastikan suara Mandarin (Google Text-to-speech) terpasang. Kamu juga bisa lanjut dengan ',h('b',{},'Mode teks'),'.',h('div',{style:'margin-top:8px'},h('button',{class:'btn navy',onclick:()=>{S.textMode=true;quiz()}},'Pakai Mode teks')))) }

// ---------- layar ----------
function mapScreen(){
  const root=h('div',{});
  root.append(h('h1',{},'Game New HSK 1'),h('p',{class:'lead'},'Selesaikan 5 level secara bertahap. Capai skor minimal 70% untuk membuka level berikutnya, dan kumpulkan bintang!'));
  const note=h('div',{class:'opts-note'},
    h('label',{},h('input',{type:'checkbox',checked:S.showPinyin,onchange:e=>{S.showPinyin=e.target.checked}}),'Tampilkan pinyin di soal'),
    h('label',{},h('input',{type:'checkbox',checked:S.unlockAll,onchange:e=>{S.unlockAll=e.target.checked;mapScreen()}}),'Buka semua level (mode guru)'));
  root.append(note);
  for(const L of LEVELS){
    const b=S.best[L.id], open=unlocked(L.id);
    root.append(h('button',{class:'lv'+(b&&b.pass?' done':''),disabled:!open,onclick:()=>start(L.id),'data-level':L.id},
      h('span',{class:'ic'},open?L.ic:'🔒'),h('span',{},h('b',{},`Level ${L.id}: ${L.name}`),h('small',{},open?`${L.desc} · ${L.n} soal`:'Selesaikan level sebelumnya dulu')),
      h('span',{class:'stars','aria-label':b?b.stars+' bintang':'belum ada bintang'},b?'★'.repeat(b.stars)+'☆'.repeat(3-b.stars):'')));
  }
  const vm=h('p',{class:'warn',hidden:true,role:'status'});
  const test=h('div',{class:'card'},h('b',{},'Cek suara untuk Level 5'),h('p',{class:'lead'},'Ujian mendengarkan memakai suara Mandarin dari perangkat Anda.'),
    h('button',{class:'btn navy',onclick:async()=>{ vm.hidden=true; const ok=canSpeak()&&await say('你好，欢迎学习汉语。'); if(!ok){vm.textContent='Suara belum keluar. Cek volume HP dan pasang suara Mandarin (Google Text-to-speech). Di Level 5 kamu bisa memakai Mode teks.';vm.hidden=false} }},'🔊 Tes suara'),vm);
  root.append(test); mount(root);
}
function mount(n){ const s=$('screen'); s.replaceChildren(n); window.scrollTo({top:0}) }
function start(level){ speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel(); S.textMode=false;
  S.sess={level,qs:build(level),i:0,correct:0,streak:0,pts:0,wrong:[],answered:false}; quiz() }

function storyBox(st){ const b=h('div',{class:'story'},h('div',{class:'tt'},st.title)); for(const s of st.sents){b.append(h('div',{class:'hz'},s.h)); if(S.showPinyin)b.append(h('div',{class:'py'},s.p))}
  const tr=h('div',{class:'tr',hidden:true},st.idn); b.append(h('button',{class:'btn navy',style:'min-height:38px;padding:4px 12px;font-size:.85rem',onclick:e=>{tr.hidden=!tr.hidden;e.target.textContent=tr.hidden?'Lihat terjemahan':'Sembunyikan terjemahan'}},'Lihat terjemahan'),tr); return b }

function quiz(){
  const s=S.sess, q=s.qs[s.i], L=LEVELS[s.level-1]; s.answered=false;
  if(q.first&&!q.seen) return storyIntro(q);
  const root=h('div',{});
  root.append(h('div',{class:'qhead'},h('span',{class:'chip'},`Level ${L.id} · ${L.name}`),h('span',{},`Soal ${s.i+1} / ${s.qs.length} · Skor ${s.pts}`+(s.streak>1?` · 🔥${s.streak}`:''))),
    h('div',{class:'bar'},h('i',{style:`width:${(s.i/s.qs.length)*100}%`})));
  const card=h('div',{class:'card'}); root.append(card);
  const fb=h('div',{'aria-live':'polite'}); const next=h('button',{class:'btn primary wide',hidden:true,id:'next',onclick:()=>{s.i++; s.i>=s.qs.length?result():quiz()}},s.i===s.qs.length-1?'Lihat hasil':'Lanjut ›');
  if(q.kind==='mc'||q.kind==='fill'||q.kind==='listen') renderMC(card,fb,next,q,s);
  else if(q.kind==='order') renderOrder(card,fb,next,q,s);
  root.append(fb,next); mount(root);
  const sure=h('div',{class:'warn',hidden:true,role:'alert'},h('b',{},'Keluar? Skor level ini tidak disimpan.'),h('div',{class:'row',style:'margin-top:8px'},
    h('button',{class:'btn primary',id:'exit-yes',onclick:()=>{speechSynthesis.cancel();mapScreen()}},'Ya, keluar'),h('button',{class:'btn',onclick:()=>{sure.hidden=true;menuBtn.hidden=false}},'Lanjut main')));
  const menuBtn=h('button',{class:'btn',id:'exit-btn',onclick:()=>{sure.hidden=false;menuBtn.hidden=true}},'‹ Peta level');
  root.append(h('div',{class:'row',style:'margin-top:10px'},h('div',{},menuBtn,sure)));
}
function award(ok,q,given){
  const s=S.sess; s.answered=true;
  if(ok){ s.correct++; s.streak++; s.pts+=10+Math.min(10,Math.max(0,s.streak-1)*2) } else { s.streak=0; s.wrong.push({q,given}) }
  document.querySelector('.qhead span:last-child').textContent=`Soal ${s.i+1} / ${s.qs.length} · Skor ${s.pts}`+(s.streak>1?` · 🔥${s.streak}`:'');
}
function feedback(fb,ok,lines){ fb.replaceChildren(h('div',{class:'fb '+(ok?'ok':'bad')},h('b',{},ok?'Benar! 🎉':'Belum tepat'),...lines.map(l=>h('div',{class:'ex'},l)))) }

function renderMC(card,fb,next,q,s){
  if(q.story) card.append(storyBox(q.story));
  let promptEl;
  if(q.kind==='mc'){
    promptEl=h('div',{class:'prompt'},h('div',{class:'lab'},q.lab),h('div',{class:'big'+(q.bigT?' t':'')},q.big));
    if(q.py&&S.showPinyin)promptEl.append(h('div',{class:'py'},q.py)); if(q.idn)promptEl.append(h('div',{class:'idn'},q.idn));
  } else if(q.kind==='fill'){
    promptEl=h('div',{class:'prompt'},h('div',{class:'lab'},'Lengkapi kalimat:'),h('div',{class:'big t'},q.x.s)); if(S.showPinyin)promptEl.append(h('div',{class:'py'},q.x.sp)); promptEl.append(h('div',{class:'idn'},q.x.idn));
  } else { // listen
    promptEl=listenPlayer(q,s);
  }
  card.append(promptEl);
  
  const btns=q.opts.map((o,i)=>{
    const sub=(o.s&&S.showPinyin)?o.s:null;
    const b=h('button',{class:'opt','data-i':i,onclick:()=>pick(i)},h('span',{class:'m'},o.m),sub?h('span',{class:'s'},sub):null); return b });
  btns.forEach(b=>card.append(b));
  function pick(i){ if(s.answered)return; const ok=i===q.ans; award(ok,q,q.opts[i].m);
    btns.forEach((b,j)=>{b.disabled=true;if(j===q.ans)b.classList.add('ok');else if(j===i)b.classList.add('bad');
      if(q.kind==='listen'&&q.opts[j].s&&!b.querySelector('.s'))b.append(h('span',{class:'s'},q.opts[j].s))});
    let lines=[];
    if(q.ex) lines.push(`${q.ex.h} · ${q.ex.p} = ${q.ex.i}`);
    else if(q.kind==='fill') lines.push(`${q.x.full} · ${q.x.fullp}`);
    else if(q.kind==='listen') lines.push(`${q.it.tr_h} · ${q.it.tr_py}`);
    else if(q.story) lines.push('Jawaban: '+q.opts[q.ans].m+(q.opts[q.ans].s?' · '+q.opts[q.ans].s:''));
    feedback(fb,ok,lines); next.hidden=false; next.focus({preventScroll:true}) }
  window.__cur={pick,ans:q.ans,q};
}
function storyIntro(q){
  const s=S.sess, L=LEVELS[s.level-1], st=q.it.st, root=h('div',{});
  root.append(h('div',{class:'qhead'},h('span',{class:'chip'},`Level ${L.id} · ${L.name}`),h('span',{},`Soal ${s.i+1} / ${s.qs.length} · Skor ${s.pts}`)),h('div',{class:'bar'},h('i',{style:`width:${(s.i/s.qs.length)*100}%`})));
  const card=h('div',{class:'card'}); root.append(card);
  card.append(h('div',{class:'prompt'},h('div',{class:'chip',style:'display:inline-block;margin-bottom:8px'},q.sec),h('div',{class:'lab'},'Dengarkan cerita dulu. Setelah itu kamu menjawab 3 pertanyaan.'),h('div',{class:'idn'},'Cerita boleh diputar maksimal 2 kali, dan jatahnya dipakai bersama saat menjawab.')));
  const go=()=>{q.seen=true;quiz()};
  if(!canSpeak()&&!S.textMode){ card.append(h('div',{class:'warn'},'Perangkat ini belum punya suara Mandarin, jadi audio tidak bisa diputar. Kamu bisa lanjut dengan ',h('b',{},'Mode teks'),'.'),h('button',{class:'btn navy',onclick:()=>{S.textMode=true;storyIntro(q)}},'Pakai Mode teks')) }
  else if(S.textMode){ card.append(h('div',{class:'story'},h('div',{class:'tt'},st.title),...st.say.map((x,i)=>h('div',{},h('div',{class:'hz'},x),S.showPinyin?h('div',{class:'py'},st.say_py[i]):null)),h('div',{class:'idn'},'Mode teks: ini pengganti audio.'))) }
  else { const info=h('div',{class:'py',id:'sinfo',style:'text-align:center'},`Sisa putar: ${st.left}x`);
    const play=h('button',{class:'play',id:'play','aria-label':'Putar cerita',disabled:st.left<=0,onclick:async()=>{ if(st.left<=0)return; st.left--; play.disabled=true; play.classList.add('on'); let ok=false;try{ok=await playStory(st)}finally{play.classList.remove('on'); if(!ok){st.left++;noAudio(card)} play.disabled=st.left<=0; info.textContent=st.left>0?`Sisa putar: ${st.left}x`:'Putaran habis.'} }},'▶');
    card.append(h('div',{class:'player'},play),info) }
  card.append(h('button',{class:'btn primary wide',id:'storygo',style:'margin-top:12px',onclick:go},'Mulai pertanyaan ›'));
  mount(root); window.__cur={intro:true,go};
}
function listenPlayer(q,s){
  const wrap=h('div',{class:'prompt'}); if(q.sec)wrap.append(h('div',{class:'chip',style:'display:inline-block;margin-bottom:8px'},q.sec)); wrap.append(h('div',{class:'lab'},q.it.q));
  const voiceOk=canSpeak();
  if(!voiceOk&&!S.textMode){
    wrap.append(h('div',{class:'warn'},'Perangkat ini belum punya suara Mandarin, jadi audio tidak bisa diputar. Kamu bisa lanjut dengan ',h('b',{},'Mode teks'),' (teks ditampilkan sebagai pengganti audio).'),
      h('button',{class:'btn navy',onclick:()=>{S.textMode=true;quiz()}},'Pakai Mode teks')); return wrap }
  if(S.textMode){ wrap.append(h('div',{class:q.it.t==='storyq'?'hz':'big t'},q.it.tr_h),h('div',{class:'py'},q.it.tr_py),h('div',{class:'idn'},'Mode teks: ini pengganti audio.')); return wrap }
  if(q.it.t==='storyq'){ const st=q.it.st; const info=h('div',{class:'py'},st.left>0?`Putar ulang cerita (sisa ${st.left}x)`:'Putaran cerita habis.');
    const play=h('button',{class:'play',id:'play','aria-label':'Putar ulang cerita',disabled:st.left<=0,onclick:async()=>{ if(st.left<=0)return; st.left--; play.disabled=true; play.classList.add('on'); let ok=false;try{ok=await playStory(st)}finally{play.classList.remove('on'); if(!ok){st.left++;noAudio(wrap)} play.disabled=st.left<=0; info.textContent=st.left>0?`Putar ulang cerita (sisa ${st.left}x)`:'Putaran cerita habis.'} }},'▶');
    wrap.append(h('div',{class:'player'},play),info); return wrap }
  let left=2; const info=h('div',{class:'py'},'Kamu bisa memutar maksimal 2 kali.');
  const play=h('button',{class:'play',id:'play','aria-label':'Putar audio',onclick:async()=>{ if(left<=0||s.answered&&false)return; left--; play.disabled=true; play.classList.add('on'); let ok=false;try{ok=await playItem(q.it)}finally{play.classList.remove('on'); if(!ok){left++;noAudio(wrap)} play.disabled=left<=0; info.textContent=left>0?`Sisa putar: ${left}x`:'Putaran habis.'} }},'▶');
  wrap.append(h('div',{class:'player'},play),info);
  if(q.it.t==='dlg') wrap.append(h('div',{class:'idn'},'Dialog: dua orang berbicara bergantian (A lalu B).'));
  return wrap;
}

function renderOrder(card,fb,next,q,s){
  const x=q.x; const tiles=shuffle(x.words.map((w,i)=>({w,i}))); let chosen=[]; 
  card.append(h('div',{class:'prompt'},h('div',{class:'lab'},'Susun kata menjadi kalimat yang benar:'),h('div',{class:'idn',style:'font-size:1.05rem'},x.idn)));
  const ans=h('div',{class:'tiles','aria-label':'Jawabanmu'}); const pool=h('div',{class:'tiles',style:'border-style:solid;border-color:transparent'});
  const check=h('button',{class:'btn primary wide',disabled:true,onclick:done},'Periksa'); 
  function tileBtn(t,inAns){return h('button',{class:'tile','data-i':t.i,onclick:()=>{ if(s.answered)return; if(inAns){chosen=chosen.filter(c=>c!==t)}else chosen.push(t); draw() }},h('span',{class:'m'},t.w.h),S.showPinyin?h('span',{class:'s'},t.w.p):null)}
  function draw(){ ans.replaceChildren(...chosen.map(t=>tileBtn(t,true))); pool.replaceChildren(...tiles.filter(t=>!chosen.includes(t)).map(t=>tileBtn(t,false))); check.disabled=chosen.length!==tiles.length }
  function done(){ if(s.answered)return; const got=chosen.map(t=>t.w.h).join('')+x.punct.replace('。','。').replace('？','？'); const ok=x.accepted.includes(got);
    award(ok,q,got); [...ans.children,...pool.children].forEach(b=>b.disabled=true); check.hidden=true;
    feedback(fb,ok,[`${x.answer.h} · ${x.answer.p}`].concat(x.accepted.length>1?['Urutan lain juga benar: '+x.accepted.filter(a=>a!==x.answer.h).join(' / ')]:[])); next.hidden=false; next.focus({preventScroll:true}) }
  card.append(ans,pool,check); draw();
  window.__cur={order:true,q,x,tiles,get chosen(){return chosen},choose(i){const t=tiles.find(t=>t.i===i);if(!chosen.includes(t)){chosen.push(t);draw()}},check:done};
}

function result(){
  const s=S.sess, L=LEVELS[s.level-1], ratio=s.correct/s.qs.length, pass=ratio>=PASS, st=pass?starsFor(ratio):0;
  const prev=S.best[L.id]; const bonus=pass?(st*20):0; S.xp+=s.pts+bonus; setXp();
  if(!prev||st>prev.stars||(pass&&!prev.pass)||ratio>(prev.ratio||0)) S.best[L.id]={pass:pass||(prev&&prev.pass),stars:Math.max(st,prev?prev.stars:0),ratio:Math.max(ratio,prev?prev.ratio||0:0)};
  const root=h('div',{class:'card result'},
    h('h1',{},pass?'Level lulus! 🎉':'Belum lulus, ayo coba lagi 💪'),
    h('div',{class:'big-stars','aria-label':st+' bintang'},'★'.repeat(st)+'☆'.repeat(3-st)),
    h('div',{class:'score'},Math.round(ratio*100)+'%'),
    h('p',{class:'lead'},`${s.correct} dari ${s.qs.length} soal benar · +${s.pts+bonus} XP (batas lulus ${PASS*100}%)`));
  const acts=h('div',{class:'row',style:'justify-content:center;margin:12px 0'});
  acts.append(h('button',{class:'btn',onclick:()=>start(L.id)},'Ulangi level'));
  if(pass&&L.id<5) acts.append(h('button',{class:'btn primary',onclick:()=>start(L.id+1)},`Level ${L.id+1} ›`));
  acts.append(h('button',{class:'btn navy',onclick:mapScreen},'Peta level')); root.append(acts);
  if(s.wrong.length){ root.append(h('h2',{style:'text-align:left;font-size:1.1rem'},'Yang perlu diulang')); for(const w of s.wrong){ const q=w.q;
    const title=q.kind==='fill'?q.x.s+' — '+q.x.idn:q.kind==='order'?q.x.idn:q.kind==='listen'?q.it.q+' ('+q.it.tr_h+')':q.big;
    const corr=q.kind==='fill'?q.x.full:q.kind==='order'?q.x.answer.h:q.opts[q.ans].m;
    root.append(h('div',{class:'rev'},h('div',{},title),h('div',{class:'a'},'Jawabanmu: '+w.given),h('div',{class:'c'},'Yang benar: '+corr))) } }
  else root.append(h('p',{},'Sempurna, tidak ada kesalahan! 🌟'));
  mount(root);
}
setXp(); mapScreen();
window.__game={S,build,LEVELS,start,mapScreen};
