<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Latihan mandiri Mandarin BAB 13–19: mini kuis dan game bertahap, lengkap dengan ujian mendengarkan.">
<title>Game & Kuis Mandarin BAB 13–19</title>
<style>
:root{--cherry:#990011;--navy:#2f3c7e;--ink:#2b2b2b;--muted:#6b6b6b;--tint:#fbe9ea;--line:#f1c7cb;--ok:#1f7a4d;--okbg:#e3f3ea;--bad:#b3261e;--badbg:#fdeceb;--bg:#fffafa}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:760px;margin:0 auto;padding:12px 14px 40px}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.top img{height:44px;width:auto}
.xp{font-weight:700;color:var(--navy);background:#eceffa;border-radius:999px;padding:4px 12px;font-size:.9rem}
h1{font-size:1.45rem;line-height:1.25;margin:4px 0 2px;color:var(--cherry)}
h2{font-size:1.15rem;color:var(--navy);margin:20px 0 6px}
.lead{color:var(--muted);margin:0 0 12px}
.card{background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.bab{display:flex;align-items:center;gap:10px;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:72px;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:10px 12px}
.bab:hover{background:var(--tint)}
.bab .ic{flex:none;width:46px;height:46px;border-radius:12px;background:var(--cherry);color:#fff;display:grid;place-items:center;font-size:1.5rem}
.bab b{display:block;line-height:1.25}.bab small{color:var(--muted)}
.bab .best{margin-left:auto;font-size:.8rem;color:var(--ok);font-weight:700;white-space:nowrap}
.lv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;min-height:68px;margin-bottom:10px;border:1.5px solid var(--line);border-radius:16px;background:#fff;padding:10px 12px}
.lv:hover:not(:disabled){background:var(--tint)}
.lv:disabled{opacity:.55;cursor:not-allowed;background:#f5f2f2}
.lv .ic{flex:none;width:50px;height:50px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-size:1.5rem}
.lv.done .ic{background:var(--cherry)}
.lv b{display:block}.lv small{color:var(--muted)}
.stars{margin-left:auto;font-size:1.2rem;color:#e0a100;white-space:nowrap;letter-spacing:2px}
.btn{min-height:48px;padding:10px 18px;font:inherit;font-weight:700;border-radius:12px;border:1.5px solid var(--cherry);background:#fff;color:var(--cherry);cursor:pointer;touch-action:manipulation}
.btn:hover:not(:disabled){background:var(--tint)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--cherry);color:#fff}.btn.primary:hover:not(:disabled){background:#76000d}
.btn.navy{border-color:var(--navy);color:var(--navy)}
.btn.wide{width:100%}
.btn.sm{min-height:38px;padding:4px 12px;font-size:.85rem}
button:focus-visible{outline:3px solid #f3a0ab;outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.opts-note{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin:8px 0}
.opts-note label{display:flex;gap:6px;align-items:center;font-size:.92rem;color:var(--muted);cursor:pointer}
.opts-note input{width:20px;height:20px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.fchip{min-height:40px;padding:4px 14px;border-radius:999px;border:1.5px solid var(--navy);background:#fff;color:var(--navy);font:inherit;font-weight:700;cursor:pointer}
.fchip[aria-pressed=true]{background:var(--navy);color:#fff}
.bar{height:10px;border-radius:99px;background:#f0e1e3;overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--cherry);width:0;transition:width .3s}
.qhead{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;color:var(--muted);flex-wrap:wrap}
.chip{background:var(--tint);color:var(--cherry);border-radius:999px;padding:2px 10px;font-weight:700}
.prompt{text-align:center;padding:8px 4px}
.prompt .lab{color:var(--muted);font-size:.95rem;margin-bottom:4px}
.prompt .big{font-size:clamp(2.2rem,11vw,3.8rem);line-height:1.2;font-weight:500;overflow-wrap:anywhere}
.prompt .big.t{font-size:clamp(1.4rem,6vw,2rem)}
.prompt .py{color:var(--muted);font-size:1.05rem}
.prompt .idn{color:var(--muted);font-size:.95rem;font-style:italic}
.opt{display:flex;flex-direction:column;align-items:flex-start;width:100%;min-height:54px;text-align:left;font:inherit;color:inherit;cursor:pointer;margin-bottom:8px;padding:10px 14px;background:#fff;border:1.5px solid #d9cfd0;border-radius:12px;touch-action:manipulation}
.opt:hover:not(:disabled){border-color:var(--navy);background:#f3f5fc}
.opt .m{font-size:1.2rem;overflow-wrap:anywhere}.opt .s{color:var(--muted);font-size:.88rem}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.opt:disabled{cursor:default}
.fb{border-radius:12px;padding:10px 12px;margin:6px 0 10px}
.fb.ok{background:var(--okbg);color:#14502f}.fb.bad{background:var(--badbg);color:#7a1a14}
.fb b{display:block}.fb .ex{margin-top:4px;color:var(--ink)}
.story{background:#fffdfd;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.story .tt{font-weight:700;color:var(--navy);margin-bottom:4px}
.story .ln{display:flex;gap:8px;margin-bottom:4px}.story .sp{flex:none;width:22px;height:22px;border-radius:50%;background:var(--navy);color:#fff;font-size:.75rem;display:grid;place-items:center;margin-top:3px}
.story .hz{font-size:1.2rem;line-height:1.35}.story .py{color:var(--muted);font-size:.85rem}.story .id{color:var(--muted);font-size:.85rem;font-style:italic}
.tiles{display:flex;flex-wrap:wrap;gap:8px;min-height:56px;padding:8px;border:2px dashed #d9cfd0;border-radius:12px;margin-bottom:10px}
.tile{min-height:50px;min-width:56px;padding:4px 12px;font:inherit;border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
.tile .m{font-size:1.25rem}.tile .s{font-size:.72rem;color:var(--muted)}
.tile:disabled{opacity:.4}
.player{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:6px 0 12px}
.play{width:84px;height:84px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:2rem;cursor:pointer}
.play:disabled{opacity:.4;cursor:not-allowed}.play.on{animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(47,60,126,.18)}}
.warn{background:#fff6e0;border:1px solid #f0d28a;border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:.93rem}
.result{text-align:center}
.score{font-size:3rem;font-weight:800;color:var(--cherry);line-height:1.1}
.big-stars{font-size:2.2rem;color:#e0a100;letter-spacing:6px}
.rev{text-align:left;border-top:1px solid var(--line);padding:8px 0;font-size:.95rem}
.rev .a{color:var(--bad)}.rev .c{color:var(--ok)}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:18px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function result(){
  const s=S.sess, ratio=s.correct/s.qs.length, pct=Math.round(ratio*100), isGame=s.mode==='game';
  const root=h('div',{class:'card result'});
  if(isGame){ const L=LEVELS[s.level-1], pass=ratio>=PASS, st=pass?starsFor(ratio):0, prev=S.best[L.id], bonus=pass?st*20:0; S.xp+=s.pts+bonus;
    S.best[L.id]={pass:pass||!!(prev&&prev.pass),stars:Math.max(st,prev?prev.stars:0),ratio:Math.max(ratio,prev?prev.ratio||0:0)}; persist(); setXp();
    root.append(h('h1',{},pass?'Level lulus! 🎉':'Belum lulus, ayo coba lagi 💪'),h('div',{class:'big-stars','aria-label':st+' bintang'},'★'.repeat(st)+'☆'.repeat(3-st)),h('div',{class:'score'},pct+'%'),
      h('p',{class:'lead'},`${s.correct} dari ${s.qs.length} soal benar · +${s.pts+bonus} XP (batas lulus ${PASS*100}%)`));
    const acts=h('div',{class:'row',style:'justify-content:center;margin:12px 0'},h('button',{class:'btn',onclick:()=>startGame(L.id)},'Ulangi level'));
    if(pass&&L.id<6) acts.append(h('button',{class:'btn primary',onclick:()=>startGame(L.id+1)},`Level ${L.id+1} ›`)); acts.append(h('button',{class:'btn navy',onclick:homeScreen},'Menu')); root.append(acts);
  } else { S.xp+=s.correct*5; S.quiz[s.bab]=Math.max(S.quiz[s.bab]||0,pct); persist(); setXp();
    root.append(h('h1',{},pct>=80?'Hebat! 🎉':pct>=60?'Lumayan, terus berlatih! 👍':'Ayo ulangi lagi 💪'),h('div',{class:'score'},pct+'%'),h('p',{class:'lead'},`${s.correct} dari ${s.qs.length} soal benar · +${s.correct*5} XP`));
    root.append(h('div',{class:'row',style:'justify-content:center;margin:12px 0'},h('button',{class:'btn primary',onclick:()=>startQuiz(s.bab)},'Ulangi kuis'),h('button',{class:'btn navy',onclick:homeScreen},'Menu'))) }
  if(s.wrong.length){ root.append(h('h2',{style:'text-align:left'},'Yang perlu diulang')); for(const w of s.wrong){ const q=w.q;
    const title=q.kind==='fill'?q.x.s+' — '+q.x.idn:q.kind==='order'?q.x.idn:q.kind==='listen'?q.q+' ('+q.tr+')':(q.big!=null?q.lab+' '+q.big:q.lab);
    const corr=q.kind==='order'?q.x.answer.h:q.opts[q.ans].m;
    root.append(h('div',{class:'rev'},h('div',{},title),h('div',{class:'a'},'Jawabanmu: '+w.given),h('div',{class:'c'},'Yang benar: '+corr))) } }
  else root.append(h('p',{},'Sempurna, tidak ada kesalahan! 🌟'));
  mount(root) }
setXp(); homeScreen();
window.__game={S,D,buildLevel,miniQuiz,LEVELS,startGame,startQuiz,homeScreen};
</script>
